<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet to Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
        }

        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            text-align: center;
        }

        .result img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Tweet to Image</h1>
    <form id="tweetForm">
        <label for="tweetUrl">Enter Twitter URL:</label>
        <input type="text" id="tweetUrl" name="tweetUrl" placeholder="https://twitter.com/user/status/123456789" required>
        <button type="submit">Generate Image</button>
    </form>

    <div class="result" id="result">
        <!-- Generated tweet image will appear here -->
    </div>

    <script>
        const form = document.getElementById('tweetForm');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const tweetUrl = document.getElementById('tweetUrl').value;

            resultDiv.innerHTML = "<p>Generating image...</p>";

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ tweet_url: tweetUrl }),
                });

                if (!response.ok) {
                    const error = await response.json();
                    resultDiv.innerHTML = `<p style="color: red;">Error: ${error.error}</p>`;
                } else {
                    const blob = await response.blob();
                    const imgUrl = URL.createObjectURL(blob);
                    resultDiv.innerHTML = `<img src="${imgUrl}" alt="Tweet Image">`;
                }
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = `<p style="color: red;">An unexpected error occurred.</p>`;
            }
        });
    </script>
</body>
</html>
